# External link check (see .github/workflows/links.yml). Keep excludes narrow —
# do not blanket-ignore linkedin.com. Template / illustrative company URLs only.
exclude_path = ["node_modules", "test"]

exclude = [
  "^https://api\\.kingminos\\.com",
  "example\\.(com|org)",
  "^https://(x|twitter)\\.com/",
  "^https://github\\.com/outboundsync/kingminos-skills/(blob|tree)/main/",
  # Sibling repos are private; anonymous lychee always 404s on them from this public repo.
  "^https://github\\.com/outboundsync/kingminos-(application|mcp|website)(/|$)",
  # Placeholder LinkedIn company pages (use backticks in Markdown instead)
  "^https://(?:www\\.)?linkedin\\.com/company/%7B",
  "^https://(?:www\\.)?linkedin\\.com/company/acme-example",
  "linkedin\\.com/company/[^/]*%7B",
]
