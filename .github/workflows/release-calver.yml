name: CalVer Release

on:
  workflow_run:
    workflows: ["Validate skill integrity"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# contents: tag + release + changelog branch; pull-requests: open/merge the
# changelog PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: calver-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # --apply also moves curated `## Unreleased` notes under the new tag in the
      # working tree (no-op when Unreleased is empty). The tag below still points
      # at RELEASE_SHA; the CHANGELOG change lands on main afterwards via a PR.
      - name: Generate release metadata and promote CHANGELOG
        id: calver
        run: node scripts/release-calver.mjs --apply --notes-file release-notes.md

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        id: tag
        if: steps.calver.outputs.has_changes == 'true'
        env:
          TAG: ${{ steps.calver.outputs.next_tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.calver.outputs.has_changes == 'true' && steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.calver.outputs.next_tag }}
          name: ${{ steps.calver.outputs.next_tag }}
          body_path: release-notes.md

      # main is protected (required `validate`, strict, admins enforced): land the
      # CHANGELOG promotion through a PR, never a direct push. Only after a new
      # tag, and only when Unreleased had entries. Optional RELEASE_PR_TOKEN (GitHub
      # App or fine-grained token, this repo only) lets the PR run CI and merge
      # itself; without it the PR is left open for a maintainer.
      - name: Land CHANGELOG promotion on main
        if: >-
          steps.calver.outputs.has_changes == 'true'
          && steps.tag.outputs.created == 'true'
          && steps.calver.outputs.changelog_updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.calver.outputs.next_tag }}
        run: bash scripts/release-changelog-pr.sh
