name: Publish to npm

# Invoked by release-calver.yml after each new CalVer GitHub release (GITHUB_TOKEN releases
# do not trigger release:published workflows). Also runnable via workflow_dispatch or when a
# release is published from a PAT/App. Set repository secret NPM_TOKEN to publish; when unset,
# the job completes with a notice and does not fail the release.
on:
  workflow_call:
    inputs:
      tag:
        description: CalVer release tag to publish (e.g. 2026.11.16.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: CalVer release tag to publish (e.g. 2026.11.16.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: >-
        ${{ inputs.tag || github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Resolve release tag
        id: tag_ref
        run: |
          tag="${RELEASE_TAG#v}"
          if [ -z "$tag" ]; then
            echo "::error::No release tag (workflow_call/workflow_dispatch require tag input; release events need tag_name)"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag_ref.outputs.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Stage package (skills copied in, version = release tag)
        run: |
          rm -rf npm/skills && cp -r skills npm/skills
          cd npm && npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice title=Skipping npm publish::NPM_TOKEN repository secret is not set. The GitHub release is unaffected; the kingminos-skills package was not published to npm."
            exit 0
          fi
          npm publish --provenance --access public