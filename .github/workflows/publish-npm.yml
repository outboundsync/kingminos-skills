name: Publish to npm

# DRAFT. Runs when a CalVer GitHub release is published (release-calver.yml). Needs repo secret
# NPM_TOKEN (npm automation token with publish rights on `kingminos-skills`). Never runs on PRs.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Stage package (skills copied in, version = release tag without v)
        run: |
          rm -rf npm/skills && cp -r skills npm/skills
          v="${{ github.event.release.tag_name || '' }}"; v="${v#v}"
          [ -n "$v" ] || { echo "::error::run from a release (no tag)"; exit 1; }
          cd npm && npm version "$v" --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
