name: Live OpenAPI surfaces

# Separate from Validate so a live-spec deploy, outage, or network blip never
# blocks a PR or CalVer release. Fails visibly and can open an issue.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Compare map to live OpenAPI
        id: check
        env:
          KINGMINOS_OPENAPI_URL: https://api.kingminos.com/openapi.yaml
        run: npm run check:surfaces

      - name: Open or update drift issue
        if: failure() && steps.check.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Live OpenAPI inventory drift"
          BODY="Scheduled \`check:surfaces\` against the live KingMinos OpenAPI failed on \`${GITHUB_SHA}\`.

          This job does not block PRs or CalVer release. See CONTRIBUTING.md (hermetic Validate vs live surfaces).

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING="$(gh issue list --search "Live OpenAPI inventory drift in:title" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
